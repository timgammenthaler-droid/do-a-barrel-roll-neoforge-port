loom.platform=neoforge

# Global
deps.yarn_build=1
deps.compat=
deps.compat_runtime=

# NeoForge - latest stable NeoForge for 1.21.11 (beta artifacts are missing installer data needed by Loom;
# this project's mods.toml has no neoforge versionRange, so a newer build-time version here is safe)
deps.fapi=
deps.fml=21.11.45
deps.yacl=3.8.1+1.21.11

# Mod
mod.mc_dep=[1.21.11, 1.21.11]
mod.mc_title=1.21.11
mod.mc_targets=1.21.11
